# fly.toml app configuration file generated for finance-api-tjepw on 2026-09-12T15:44:33Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'finance-api-tjepw'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  SERVER_ADDRESS = '0.0.0.0'
  SERVER_PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "60s"
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/actuator/health"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
