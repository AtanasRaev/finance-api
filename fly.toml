app = "finance-api-tjepw"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  SERVER_ADDRESS = "0.0.0.0"
  SERVER_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
