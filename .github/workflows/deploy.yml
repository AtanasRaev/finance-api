name: Build and deploy Finance API

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finance-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: finance
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U finance -d finance"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run tests
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/finance
          DATABASE_USERNAME: finance
          DATABASE_PASSWORD: ci-only-password
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew --no-daemon test

      - uses: docker/setup-buildx-action@v4

      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: nasko0
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            nasko0/finance-api:latest
            nasko0/finance-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:finance-ci

      - name: Configure SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PI_SSH_KEY" > ~/.ssh/finance-deploy
          chmod 600 ~/.ssh/finance-deploy
          printf '%s\n' \
            '100.75.135.70 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDsWarQmdZLZCMpGoBuLVt+LqjRb2V+uMVjln5omlWTI' \
            > ~/.ssh/known_hosts

      - name: Deploy and check health
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          ssh \
            -i ~/.ssh/finance-deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            atanas@100.75.135.70 \
            bash -s -- "$IMAGE_DIGEST" <<'REMOTE'
          set -euo pipefail
          cd /home/atanas/docker/finance

          cat > compose.image.yaml <<EOF
          services:
            app:
              image: nasko0/finance-api@$1
          EOF

          docker compose -f compose.yaml -f compose.image.yaml pull app
          docker compose -f compose.yaml -f compose.image.yaml up -d --no-deps app

          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 \
              http://100.75.135.70:8083/actuator/health \
              | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("status") == "UP" else 1)'
            then
              echo "Finance API is healthy."
              exit 0
            fi
            sleep 3
          done

          docker compose logs --tail=100 app
          exit 1
          REMOTE

      - name: Remove deployment key
        if: always()
        run: rm -f ~/.ssh/finance-deploy